name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mansaoferta_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mansaoferta_test?schema=public
      AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci
      ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Publish the Docker image only after quality passes, and only on main.
  # Set the DOCKERHUB_IMAGE repo variable to change the image name/namespace
  # (must match the account behind DOCKERHUB_USERNAME); defaults to mansaoferta/app.
  publish:
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'mansaoferta/app' }}
    steps:
      # Skip publishing (instead of failing) when Docker Hub secrets are absent.
      - name: Check Docker Hub credentials
        id: creds
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DOCKERHUB_USERNAME/DOCKERHUB_TOKEN no configurados; se omite la publicación de la imagen."
          fi
      - uses: actions/checkout@v4
        if: steps.creds.outputs.available == 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.creds.outputs.available == 'true'
      - uses: docker/login-action@v3
        if: steps.creds.outputs.available == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        if: steps.creds.outputs.available == 'true'
        with:
          context: .
          push: true
          # A moving `latest` (consumed by docker-compose.yml) plus an immutable
          # per-commit tag for rollbacks / pinning via APP_IMAGE.
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
